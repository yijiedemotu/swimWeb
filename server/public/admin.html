<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校游泳队 - 后台管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          colors: {
            navy: '#122E8A',
            cream: '#F5EFEA'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-cream min-h-screen">
  <nav class="bg-navy text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold">校游泳队 - 后台管理系统</h1>
      <a href="/" class="text-sm text-white/70 hover:text-white">返回前台</a>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-white rounded-xl p-6 shadow-sm">
        <div class="text-3xl font-black text-navy" id="statNews">0</div>
        <div class="text-sm text-gray-500 mt-1">新闻数量</div>
      </div>
      <div class="bg-white rounded-xl p-6 shadow-sm">
        <div class="text-3xl font-black text-navy" id="statMembers">0</div>
        <div class="text-sm text-gray-500 mt-1">队员数量</div>
      </div>
      <div class="bg-white rounded-xl p-6 shadow-sm">
        <div class="text-3xl font-black text-navy" id="statContacts">0</div>
        <div class="text-sm text-gray-500 mt-1">留言数量</div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div class="bg-white rounded-xl p-6 shadow-sm">
        <h2 class="text-lg font-bold text-gray-800 mb-4">发布新闻</h2>
        <form id="newsForm" class="space-y-4">
          <input name="title" placeholder="新闻标题" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-navy" required />
          <textarea name="excerpt" placeholder="新闻摘要" rows="2" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-navy resize-none"></textarea>
          <textarea name="content" placeholder="新闻正文" rows="4" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-navy resize-none"></textarea>
          <div class="grid grid-cols-2 gap-4">
            <select name="category" class="px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-navy">
              <option value="赛事">赛事</option>
              <option value="队务">队务</option>
              <option value="活动">活动</option>
              <option value="公告">公告</option>
            </select>
            <input name="date" type="date" class="px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-navy" />
          </div>
          <div>
            <input name="imageFile" type="file" accept="image/*" onchange="uploadFile(this, 'imagePreview')" class="w-full px-4 py-3 border border-gray-300 rounded-lg" />
            <input name="imageUrl" type="hidden" />
            <img id="imagePreview" class="mt-2 h-20 rounded hidden" />
          </div>
          <button type="submit" class="w-full py-3 bg-navy text-white rounded-lg hover:opacity-90 transition font-medium">发布新闻</button>
        </form>
      </div>

      <div class="space-y-6">
        <div class="bg-white rounded-xl p-6 shadow-sm">
          <h2 class="text-lg font-bold text-gray-800 mb-4">新闻列表</h2>
          <div id="newsList" class="space-y-3 max-h-96 overflow-y-auto"></div>
        </div>

        <div class="bg-white rounded-xl p-6 shadow-sm">
          <h2 class="text-lg font-bold text-gray-800 mb-4">添加队员</h2>
          <form id="memberForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <input name="name" placeholder="姓名" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-navy" required />
              <input name="grade" placeholder="年级专业" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-navy" />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <input name="position" placeholder="职位" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-navy" />
              <select name="category" class="px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-navy">
                <option value="captain">队长</option>
                <option value="main">主力队员</option>
                <option value="new">新队员</option>
              </select>
            </div>
            <input name="tags" placeholder="标签（逗号分隔）" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-navy" />
            <div>
              <input name="avatarFile" type="file" accept="image/*" onchange="uploadFile(this, 'avatarPreview')" class="w-full px-4 py-3 border border-gray-300 rounded-lg" />
              <input name="avatarUrl" type="hidden" />
              <img id="avatarPreview" class="mt-2 h-20 rounded hidden" />
            </div>
            <button type="submit" class="w-full py-3 bg-navy text-white rounded-lg hover:opacity-90 transition font-medium">添加队员</button>
          </form>
        </div>

        <div class="bg-white rounded-xl p-6 shadow-sm">
          <h2 class="text-lg font-bold text-gray-800 mb-4">队员列表</h2>
          <div id="memberList" class="space-y-3 max-h-64 overflow-y-auto"></div>
        </div>

        <div class="bg-white rounded-xl p-6 shadow-sm">
          <h2 class="text-lg font-bold text-gray-800 mb-4">留言管理</h2>
          <div id="contactList" class="space-y-3 max-h-64 overflow-y-auto"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function uploadFile(input, previewId) {
      const file = input.files[0]
      if (!file) return
      const formData = new FormData()
      formData.append('file', file)
      fetch('/api/upload', { method: 'POST', body: formData })
        .then(r => r.json())
        .then(data => {
          if (data.url) {
            const preview = document.getElementById(previewId)
            if (preview) {
              preview.src = data.url
              preview.classList.remove('hidden')
            }
            const form = input.closest('form')
            const urlInput = form.querySelector('input[name="imageUrl"], input[name="avatarUrl"]')
            if (urlInput) urlInput.value = data.url
          }
        })
        .catch(() => alert('上传失败'))
    }

    document.getElementById('newsForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      const form = e.target
      const data = {
        title: form.title.value,
        excerpt: form.excerpt.value,
        content: form.content.value,
        category: form.category.value,
        date: form.date.value,
        image: form.imageUrl?.value || ''
      }
      await fetch('/api/news', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      form.reset()
      const preview = document.getElementById('imagePreview')
      if (preview) preview.classList.add('hidden')
      loadNews()
      loadStats()
    })

    document.getElementById('memberForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      const form = e.target
      const data = {
        name: form.name.value,
        grade: form.grade.value,
        position: form.position.value,
        category: form.category.value,
        tags: form.tags.value.split(',').map(t => t.trim()).filter(Boolean),
        avatar: form.avatarUrl?.value || ''
      }
      await fetch('/api/members', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      form.reset()
      const preview = document.getElementById('avatarPreview')
      if (preview) preview.classList.add('hidden')
      loadMembers()
      loadStats()
    })

    async function loadNews() {
      const res = await fetch('/api/news')
      const data = await res.json()
      document.getElementById('newsList').innerHTML = data.map(n => `
        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
          <div class="flex-1 min-w-0">
            <span class="inline-block px-2 py-0.5 bg-navy/10 text-navy text-xs rounded mr-2">${n.category}</span>
            <span class="font-medium text-sm truncate">${n.title}</span>
          </div>
          <button onclick="deleteNews(${n.id})" class="ml-3 px-3 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600 flex-shrink-0">删除</button>
        </div>
      `).join('') || '<p class="text-gray-400 text-sm">暂无新闻</p>'
    }

    async function loadMembers() {
      const res = await fetch('/api/members')
      const data = await res.json()
      document.getElementById('memberList').innerHTML = data.map(m => `
        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
          <div class="flex-1 min-w-0">
            <span class="font-medium text-sm">${m.name}</span>
            <span class="text-xs text-gray-500 ml-2">${m.grade || ''}</span>
            <span class="inline-block px-2 py-0.5 bg-green-100 text-green-700 text-xs rounded ml-2">${m.position || ''}</span>
          </div>
          <button onclick="deleteMember(${m.id})" class="ml-3 px-3 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600 flex-shrink-0">删除</button>
        </div>
      `).join('') || '<p class="text-gray-400 text-sm">暂无队员</p>'
    }

    async function loadContacts() {
      const res = await fetch('/api/contacts')
      const data = await res.json()
      document.getElementById('contactList').innerHTML = data.length === 0 ? '<p class="text-gray-400 text-sm">暂无留言</p>' : data.map(c => `
        <div class="p-3 bg-gray-50 rounded-lg">
          <div class="flex items-center justify-between mb-1">
            <span class="font-medium text-sm">${c.name}</span>
            <span class="text-xs text-gray-400">${c.created_at || ''}</span>
          </div>
          <p class="text-xs text-gray-500">${c.email || ''} | ${c.phone || ''}</p>
          <p class="text-sm text-gray-700 mt-1">${c.message || ''}</p>
        </div>
      `).join('')
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/stats')
        const data = await res.json()
        document.getElementById('statNews').textContent = data.news
        document.getElementById('statMembers').textContent = data.members
        document.getElementById('statContacts').textContent = data.contacts
      } catch (e) {}
    }

    async function deleteNews(id) {
      if (!confirm('确定删除此新闻？')) return
      await fetch('/api/news/' + id, { method: 'DELETE' })
      loadNews()
      loadStats()
    }

    async function deleteMember(id) {
      if (!confirm('确定删除此队员？')) return
      await fetch('/api/members/' + id, { method: 'DELETE' })
      loadMembers()
      loadStats()
    }

    loadNews()
    loadMembers()
    loadContacts()
    loadStats()
  </script>
</body>
</html>
